<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>20 Clienti · 10 Slide</title>
<style>
:root{--bg:#fff;--bg2:#f5f5f7;--ink:#1d1d1f;--mut:#86868b;--line:#e8e8ed;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(50px + var(--sb))}
.bar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:calc(10px + var(--st)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
.bar b{font-size:15px;letter-spacing:-.02em}
.bar b span{color:var(--mut);font-weight:500}
.bar button{border:1px solid var(--line);background:var(--bg2);font-family:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:999px;cursor:pointer;margin-left:6px}
.bar button:active{opacity:.6}
.hero{padding:52px 20px 26px;text-align:center}
.hero h1{font-size:clamp(30px,8vw,48px);font-weight:800;letter-spacing:-.035em;line-height:1.05}
.hero p{color:var(--mut);font-size:15px;margin-top:12px}
.types{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.types span{font-size:11px;font-weight:700;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--ink)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 14px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.client{border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden;background:#fff}
.client.open{box-shadow:0 6px 22px rgba(0,0,0,.08)}
.chead{width:100%;border:0;background:none;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:12px;padding:16px;text-align:left}
.chead:active{background:var(--bg2)}
.num{width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:12px;font-weight:800}
.client.open .num{background:var(--ink);color:#fff}
.who{flex:1;min-width:0}
.who strong{display:block;font-size:16px;font-weight:700;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{width:24px;height:24px;flex:0 0 24px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;color:var(--mut);font-size:13px;transition:transform .3s}
.client.open .chev{transform:rotate(90deg);background:var(--ink);color:#fff}
.cbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1)}
.client.open .cbody{grid-template-rows:1fr}
.cin{overflow:hidden}
.pad{padding:2px 16px 18px}
.slide{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.stype{flex:0 0 78px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding-top:4px}
.sbody{flex:1;min-width:0}
.sbody p{font-size:15px;font-weight:600;letter-spacing:-.01em;padding:2px 0 2px 14px;position:relative}
.sbody p::before{content:"";position:absolute;left:0;top:11px;width:5px;height:5px;border-radius:50%;background:var(--mut)}
.sbody p:only-child::before{display:none}
.sbody p:only-child{padding-left:0}
.sbody p.big{font-size:21px;font-weight:800;letter-spacing:-.025em;padding-left:0}
.sbody p.big::before{display:none}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:36px;padding:0 20px}
</style>
</head>
<body>

<div class="bar">
  <b>20 Clienti <span>· 10 slide</span></b>
  <div><button id="bC">Chiudi</button><button id="bA">Apri tutto</button></div>
</div>

<div class="hero">
  <h1>Idee e titoli.<br>Niente numeri.</h1>
  <p>20 piccole imprese italiane, 10 slide ciascuna: titolo d'effetto e righe brevi pronte da impaginare.</p>
  <div class="types" id="types"></div>
</div>

<div class="wrap">
  <div class="pills" id="pills"></div>
  <div id="list"></div>
</div>

<footer>Titoli e concept pronti · ogni riga diventa un blocco della slide</footer>
